[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-ocr"
version = "0.1.0"
description = "Extract text and metadata from images without a vision model (local OCR fallback)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rapidocr-onnxruntime",
    "pillow",
]

[project.scripts]
image-ocr = "image_ocr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
